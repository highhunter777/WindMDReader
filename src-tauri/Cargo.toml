[package]
name = "windmd"
version = "0.2.0"
description = "WindMD — 本地优先、高性能的 Markdown 阅读器"
authors = ["WindMD"]
edition = "2021"
rust-version = "1.77"
# 关闭自动发现,并显式声明唯一的可执行文件:
# src/bin/*.rs 下的性能基准脚本是临时调试产物,不该被当成独立 bin 参与构建
autobins = false

[[bin]]
name = "windmd"
path = "src/main.rs"

[lib]
name = "windmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
